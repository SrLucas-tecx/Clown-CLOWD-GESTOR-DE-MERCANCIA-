<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CLOWN CLOUD</title>
  <link rel="icon" type="image/svg+xml" href="img/logo-payaso.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos (el orden importa: responsive.css y ventas.css van al final para poder sobrescribir) -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/navegacion.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/ventas.css">
</head>

<body>
  <div class="app-layout">

    <!-- Barra superior: marca, secciones y accesos rápidos; debajo, las pestañas de la sección -->
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <div class="brand">
          <img class="logo-img" src="img/logo-payaso.svg" alt="">
          <span class="logo-word">CLOWN CLOUD</span>
        </div>

        <nav class="main-nav" id="nav" aria-label="Secciones"></nav>

        <div class="topbar-actions">
          <button class="btn ghost" id="mb" title="Modo bazar"><span aria-hidden="true">🛍️</span><span class="txt">Modo bazar</span></button>
          <button class="btn ghost" id="cq" title="Registrar consulta"><span aria-hidden="true">❓</span><span class="txt">Consulta</span></button>
          <button class="btn" id="cta" title="Venta rápida"><span aria-hidden="true">⚡</span><span class="txt">Venta rápida</span></button>
        </div>
      </div>

      <nav class="subnav" id="subnav" aria-label="Pestañas de la sección"></nav>
    </header>

    <main class="page-content">
      <div id="view"></div>
    </main>
  </div>

  <div id="modal" class="modal-overlay"></div>
  <div id="toast"></div>

  <!-- Librerías externas (PDF y Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Núcleo -->
  <script src="js/core/db.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/etiquetas.js"></script>
  <script src="js/core/categorias.js"></script>
  <script src="js/core/excel.js"></script>
  <script src="js/core/logos.js"></script>
  <script src="js/core/pdf.js"></script>
  <script src="js/core/semilla.js"></script>
  <script src="js/core/grupos.js"></script>

  <!-- Módulos -->
  <script src="js/modules/inicio.js"></script>
  <script src="js/modules/ventas.js"></script>
  <script src="js/modules/historial.js"></script>
  <script src="js/modules/catalogo.js"></script>
  <script src="js/modules/inventario.js"></script>
  <script src="js/modules/promos.js"></script>
  <script src="js/modules/bazar.js"></script>
  <script src="js/modules/maleta.js"></script>
  <script src="js/modules/listas.js"></script>
  <script src="js/modules/pedidos.js"></script>
  <script src="js/modules/interes.js"></script>
  <script src="js/modules/clientes.js"></script>
  <script src="js/modules/eventos.js"></script>
  <script src="js/modules/juegos.js"></script>
  <script src="js/modules/caja.js"></script>
  <script src="js/modules/compras.js"></script>
  <script src="js/modules/temas.js"></script>
  <script src="js/modules/altas.js"></script>
  <script src="js/modules/materiales.js"></script>
  <script src="js/modules/alertas.js"></script>
  <script src="js/modules/rentabilidad.js"></script>
  <script src="js/modules/costos.js"></script>
  <script src="js/modules/respaldo.js"></script>
  <script src="js/modules/ajustes.js"></script>
  <script src="js/modules/colores.js"></script>
  <script src="js/modules/tipos.js"></script>
  <script src="js/modules/comparativa.js"></script>
  <script src="js/modules/sorpresa.js"></script>
  <script src="js/modules/reportes.js"></script>
  <script src="js/modules/intercambio.js"></script>

  <!-- Arranque -->
  <script src="js/app.js"></script>
</body>

</html>
